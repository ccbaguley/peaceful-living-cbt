name: Privacy & Syntax Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify Python Syntax
        run: python3 -m py_compile app.py

      - name: Verify Zero Disk-Writing Calls (AST Audit)
        run: |
          python3 - << 'EOF'
          import ast

          with open("app.py", "r", encoding="utf-8") as f:
              tree = ast.parse(f.read(), filename="app.py")

          forbidden_names = {"open", "sqlite3", "pickle", "shelve"}
          for node in ast.walk(tree):
              if isinstance(node, ast.Name) and node.id in forbidden_names:
                  raise AssertionError(f"Privacy violation: forbidden identifier '{node.id}' found in app.py")
              if isinstance(node, ast.Attribute) and node.attr in {"write_text", "write_bytes"}:
                  raise AssertionError(f"Privacy violation: forbidden file write '{node.attr}' found in app.py")

          print("Privacy & syntax audit passed: zero disk-writing calls detected.")
          EOF
