name: Privacy & Syntax Audit

on: [push, pull_request]

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Python Syntax
        run: python3 -m py_compile app.py
      - name: Check Zero Disk Writes
        run: python3 -c "import ast; tree = ast.parse(open('app.py').read()); bad = [n.id for n in ast.walk(tree) if isinstance(n, ast.Name) and n.id in {'open','sqlite3','pickle','shelve'}]; assert not bad, bad; print('Audit Passed')"
