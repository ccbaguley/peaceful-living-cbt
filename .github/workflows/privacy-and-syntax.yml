name: Privacy & Syntax Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python Syntax
        run: python3 -m py_compile app.py

      - name: Verify Zero Disk-Writing Functions
        run: |
          python3 -c '
          with open("app.py", "r", encoding="utf-8") as f:
              code = f.read()
          forbidden = ["open(", "sqlite3", "logging.", "pickle.", "shelve."]
          for item in forbidden:
              assert item not in code, f"Privacy violation: {item} found in app.py"
          print("Privacy audit passed: zero disk-writing calls detected.")
          '
